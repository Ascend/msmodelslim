name: Build Job

on:
  workflow_call:
    inputs:
      REMOTE_URL:
        required: false
        type: string
        default: ${{ atomgit.repositoryurl }}
      pr_id:
        required: false
        type: string
        default: ${{ atomgit.event.pull_request.number }}
      IMAGE_FLAG:
        required: true
        type: string
      TARGET_BRANCH:
        required: false
        type: string
        default: ${{ atomgit.event.pull_request.base.ref }}
      runs_on_arch:
        required: true
        type: string
      ARTIFACT_NAME:
        required: true
        type: string

jobs:
  JOB_build:
    name: JOB_build
    env:
      ARTIFACT_NAME: ${{ format('{0}-{1}', inputs.ARTIFACT_NAME, atomgit.run_number) }}
    select: selected_by_default
    runs-on: [ dedicate-hosted, "${{ inputs.runs_on_arch }}", large ]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/mindstudio-image/${{ inputs.IMAGE_FLAG }}
      options: --user root
    steps:
      - name: clone repo and merge PR
        run: |
          set -ex
          source use-python 3.8
          pip install setuptools
          python3 --version
          git clone -b ${{ inputs.TARGET_BRANCH }} ${{ inputs.REMOTE_URL }} CODE
          cd CODE
          git config --global user.email "AtlasAccount@noreply.gitcode.com"
          git config --global user.name "AtlasAccount"
          git fetch origin
          git fetch origin refs/merge-requests/${{ inputs.pr_id }}/head:new_${{ inputs.pr_id }}
          git checkout new_${{ inputs.pr_id }}
          git merge origin/${{ inputs.TARGET_BRANCH }}
          git diff-tree -r --name-only --no-commit-id origin/${{ inputs.TARGET_BRANCH }} HEAD > ../modify_files.txt
          cat ../modify_files.txt
      - name: build
        run: |
          set -ex
          source use-python 3.8
          # 给 CMake FindPython 提供当前 Python 的头文件/库提示（manylinux 镜像默认找不到）
          PY_PREFIX=$(python3 -c "import sysconfig; print(sysconfig.get_config_var('prefix'))")
          PY_INC=$(python3 -c "import sysconfig; print(sysconfig.get_config_var('INCLUDEPY'))")
          PY_LIB=$(ls "$(python3 -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")"/libpython3*.so 2>/dev/null | head -n1 || true)
          export Python3_ROOT_DIR="${PY_PREFIX}"
          export Python3_EXECUTABLE="$(command -v python3)"
          export Python3_INCLUDE_DIR="${PY_INC}"
          export Python3_LIBRARY="${PY_LIB}"
          export Python3_FIND_STRATEGY="LOCATION"
          export Python_ROOT_DIR="${PY_PREFIX}"
          export Python_EXECUTABLE="$(command -v python3)"
          export Python_INCLUDE_DIR="${PY_INC}"
          export Python_LIBRARY="${PY_LIB}"
          echo "PY_PREFIX=${PY_PREFIX} PY_INC=${PY_INC} PY_LIB=${PY_LIB}"
          cd ${ATOMGIT_WORKSPACE}/CODE
          bash scripts/download_thirdparty.sh
          bash build/build.sh
          find ./ -name *.run
          cp ./output/*.run ${ATOMGIT_WORKSPACE}
          ls -la ${ATOMGIT_WORKSPACE}/*.run
      - name: Upload artifacts
        uses: upload-artifact
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: "*.run"
