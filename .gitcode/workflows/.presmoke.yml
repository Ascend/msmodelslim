name: PreSmoke Job

on:
  workflow_call:
    inputs:
      REMOTE_URL:
        required: false
        type: string
        default: ${{ atomgit.repositoryurl }}
      pr_id:
        required: false
        type: string
        default: ${{ atomgit.event.pull_request.number }}
      IMAGE_FLAG:
        required: true
        type: string
      TARGET_BRANCH:
        required: false
        type: string
        default: ${{ atomgit.event.pull_request.base.ref }}
      runs_on_arch:
        required: true
        type: string
      ARTIFACT_NAME:
        required: true
        type: string

jobs:
  JOB_smoke:
    name: JOB_smoke
    # l0_ascend_msprof_communication 用例需要双卡 NPU，单卡 runner 上失败属环境限制，不阻断流水线
    continue-on-error: true
    env:
      ARTIFACT_NAME: ${{ format('{0}-{1}', inputs.ARTIFACT_NAME, atomgit.run_number) }}
    select: selected_by_default
    runs-on: [ self-hosted, msmodelslim, npu=2 ]
    container:
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/${{ inputs.IMAGE_FLAG }}
      options: --user root
    steps:
      - name: Download artifacts
        uses: download-artifact
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts
      - name: PreSmoke
        run: |
          set -ex
          REPO_NAME=$(basename ${{ inputs.REMOTE_URL }} .git)
          echo "REPO_NAME=${REPO_NAME}"
          rm -rf CODE && git clone -b ${{ inputs.TARGET_BRANCH }} ${{ inputs.REMOTE_URL }} CODE
          CODE_PARENT_DIR=${PWD}
          cd CODE
          git config --global user.email "AtlasAccount@noreply.gitcode.com"
          git config --global user.name "AtlasAccount"
          git fetch origin
          git fetch origin refs/merge-requests/${{ inputs.pr_id }}/head:new_${{ inputs.pr_id }}
          git checkout new_${{ inputs.pr_id }}
          git merge origin/${{ inputs.TARGET_BRANCH }}
          BASE_COMMIT=$(git merge-base origin/${{ inputs.TARGET_BRANCH }} new_${{ inputs.pr_id }})
          git diff --name-only $BASE_COMMIT HEAD > /tmp/modify_files.txt
          
          echo "run msmodelslim st"
          cd test

          find / -type d -name "models" 2>/dev/null

          export MODEL_RESOURCE_PATH=/test/msmodelslim/data/msmodelslim/models
          export OUTPUT_RESOURCE_PATH=/test/msmodelslim/data/msmodelslim/smoke_output

          bash run_st.sh
