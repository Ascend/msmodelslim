apiversion: modelslim_v1
metadata:
  config_id: glm_5_next_w8a8
  score: 90
  verified_tags:
    GLM-5.3-Flash:
      - - vLLM-Ascend
        - Atlas_A2_Inference
      - - vLLM-Ascend
        - Atlas_A3_Inference
  label:
    w_bit: 8
    a_bit: 8
    is_sparse: False
    kv_cache: False

default_w8a8_dynamic: &default_w8a8_dynamic
  act:
    scope: "per_token"
    dtype: "int8"
    symmetric: True
    method: "minmax"
  weight:
    scope: "per_channel"
    dtype: "int8"
    symmetric: True
    method: "minmax"

spec:
  process:
    - type: "quarot"
      export_extra_info: True

    - type: "flex_smooth_quant"
      enable_subgraph_type:
        - 'norm-linear'
      include:
        - "*"

    # 量化范围与FP8方案对齐: mlp + MLA层(3,7,...,43,45)的q_a/q_b/kv_a/o_proj
    - type: "linear_quant"
      qconfig: *default_w8a8_dynamic
      include:
        - "*mlp*"
        - "*self_attn.q_a_proj"
        - "*self_attn.q_b_proj"
        - "*self_attn.kv_a_proj_with_mqa"
        - "*layers.{3,7,11,15,19,23,27,31,35,39,43,45}.self_attn.o_proj"
      exclude:
        - "*gate"

  dataset: mix_calib.jsonl
  save:
    - type: "ascendv1_saver"
      part_file_size: 4
