apiversion: multimodal_vlm_modelslim_v1
metadata:
  config_id: qwen3_5_27b_w8a8_fa_mxfp8
  score: 90
  verified_tags:
    Qwen3.5-27B:
      - - vLLM_Ascend
        - Ascend_950
  label:
    w_bit: 8
    a_bit: 8
    is_sparse: False
    kv_cache: True

default_w8a8_dynamic: &default_w8a8_dynamic
  act:
    scope: "per_block"
    dtype: "mxfp8"
    symmetric: True
    method: "minmax"
  weight:
    scope: "per_block"
    dtype: "mxfp8"
    symmetric: True
    method: "minmax"

spec:
  process:
    - type: "linear_quant"
      qconfig: *default_w8a8_dynamic
      include:
        - "*self_attn*"
        - "*mlp*"
      exclude:
        - "*self_attn.o_proj*"
        - "mtp*"
        - "*linear_fc2*"
        - "*visual*"
        - "*mlp.down_proj*"
    - type: "fa3_quant"
      details:
        fa_q:
          dtype: "mxfp8"
          scope: "per_block"
          symmetric: True
          method: "minmax"
        fa_k:
          dtype: "mxfp8"
          scope: "per_block"
          symmetric: True
          method: "minmax"
        fa_v:
          dtype: "mxfp8"
          scope: "per_channel"
          symmetric: True
          method: "minmax"
      include:
        - "*self_attn*"
      exclude:
        - "*linear_attn*"
        - "mtp*"
        - "*visual*"
  save:
    - type: "ascendv1_saver"
      part_file_size: 4
  dataset: "qwen3_cot_vlm_text"
