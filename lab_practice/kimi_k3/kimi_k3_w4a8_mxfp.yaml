apiversion: multimodal_vlm_modelslim_v1
metadata:
  config_id: kimi_k3_w4a8_mxfp
  score: 89
  verified_tags:
    Kimi-K3:
      - - vLLM_Ascend
        - Ascend_950
  label:
    w_bit: 4
    a_bit: 8
    is_sparse: False
    kv_cache: False

default_w4a8_mxfp: &default_w4a8_mxfp
  act:
    scope: "per_block"
    dtype: "mxfp8"
    symmetric: True
    method: "minmax"
  weight:
    scope: "per_block"
    dtype: "mxfp4"
    symmetric: True
    method: "minmax"

default_w8a8_mxfp: &default_w8a8_mxfp
  act:
    scope: "per_block"
    dtype: "mxfp8"
    symmetric: True
    method: "minmax"
  weight:
    scope: "per_block"
    dtype: "mxfp8"
    symmetric: True
    method: "minmax"

spec:
  runner: auto
  process:
    - type: "quarot"
      block_size: 32

    - type: "flex_awq_ssz"
      qconfig:
        act:
          scope: "per_token"
          dtype: "int8"
          symmetric: True
          method: "minmax"
        weight:
          scope: "per_channel"
          dtype: "int4"
          symmetric: True
          method: "ssz"
          ext:
            step: 10
      enable_subgraph_type:
        - "up-down"
      include:
        - "language_model.model.layers.*.block_sparse_moe.experts.*.w3"

    - type: "flex_smooth_quant"
      enable_subgraph_type:
        - "norm-linear"
      include:
        - "language_model.model.layers.*.block_sparse_moe.routed_expert_norm"
        - "language_model.model.layers.*.input_layernorm"
        - "language_model.model.layers.*.self_attn.q_a_layernorm"

    - type: "group"
      configs:
        - type: "linear_quant"
          qconfig: *default_w4a8_mxfp
          include:
            - "language_model.model.layers.*.block_sparse_moe.experts.*.w3"
            - "language_model.model.layers.*.block_sparse_moe.experts.*.w2"
            - "language_model.model.layers.*.block_sparse_moe.experts.*.w1"
            - "language_model.model.layers.*.block_sparse_moe.shared_experts.up_proj"
            - "language_model.model.layers.*.block_sparse_moe.shared_experts.down_proj"
            - "language_model.model.layers.*.block_sparse_moe.shared_experts.gate_proj"

        - type: "linear_quant"
          qconfig: *default_w8a8_mxfp
          include:
            - "language_model.model.layers.*.self_attn.q_proj"
            - "language_model.model.layers.*.self_attn.k_proj"
            - "language_model.model.layers.*.self_attn.v_proj"
            - "language_model.model.layers.*.self_attn.q_a_proj"
            - "language_model.model.layers.*.self_attn.q_b_proj"
            - "language_model.model.layers.*.self_attn.kv_a_proj_with_mqa"
            - "language_model.model.layers.0.mlp.gate_proj"
            - "language_model.model.layers.0.mlp.up_proj"
            - "language_model.model.layers.0.mlp.down_proj"
            - "language_model.model.layers.*.block_sparse_moe.routed_expert_up_proj"
            - "language_model.model.layers.*.block_sparse_moe.routed_expert_down_proj"

  dataset: calibImages
  save:
    - type: "ascendv1_saver"
      part_file_size: 4
