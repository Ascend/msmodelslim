apiversion: modelslim_v1

metadata:
  config_id: llm_transformers_w8a8_mxfp8
  score: 50
  verified_model_types:
    - transformers
  label:
    w_bit: 8
    a_bit: 8
    is_sparse: False
    kv_cache: False

default_w8a8_dynamic: &default_w8a8_mxfp8_dynamic
  act:
    scope: "per_block"
    dtype: "mxfp8"
    symmetric: True
    method: "minmax"
  weight:
    scope: "per_block"
    dtype: "mxfp8"
    symmetric: True
    method: "minmax"

spec:
  runner: "model_wise"
  process:
    - type: "linear_quant"
      qconfig: *default_w8a8_mxfp8_dynamic
      include: [ "*" ]

  save:
    - type: "ascendv1_saver"
      part_file_size: 4
