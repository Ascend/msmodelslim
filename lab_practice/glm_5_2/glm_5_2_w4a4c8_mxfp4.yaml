apiversion: modelslim_v1
metadata:
  config_id: glm_5_2_w4a4c8_mxfp4
  score: 90.0
  verified_tags:
    GLM-5.2:
    - - vLLM_Ascend
      - Atlas_350
  label:
    w_bit: 4
    a_bit: 4
    is_sparse: False
    kv_cache: True

default_w8a8_mxfp_dynamic:
  &default_w8a8_mxfp_dynamic
  act:
    scope: per_block
    dtype: mxfp8
    symmetric: true
    method: minmax
  weight:
    scope: per_block
    dtype: mxfp8
    symmetric: true
    method: minmax

default_w4a4_mxfp_dynamic:
  &default_w4a4_mxfp_dynamic
  act:
    scope: per_block
    dtype: mxfp4
    symmetric: true
    method: minmax
  weight:
    scope: per_block
    dtype: mxfp4
    symmetric: true
    method: minmax

spec:
  process:
  - type: quarot
    export_extra_info: true
  - type: flex_smooth_quant
    enable_subgraph_type:
    - norm-linear
    - ov
    include:
    - '*'
  # fa3 quantization for Indexer (fa3_q, fa3_k): per-token fp8 on rotated q/k
  # Skip the precision-sensitive indexer in GLM5.2
  - type: "fa3_quant"
    qconfig:
      dtype: "fp8_e4m3"
      scope: "per_token"
      symmetric: True
      method: "minmax"
    include:
      - "*indexer*"
    exclude:
      - "model.layers.0.*"
      - "model.layers.1.*"
      - "model.layers.2.*"
      - "model.layers.70.*"
      - "model.layers.74.*"
      - "model.layers.78.*"
  # fa3 quantization for knope (kv_cache compression): per-tile mxfp8 on MLA kv_a_layernorm output
  # Skip the precision-sensitive layers in GLM5.2
  - type: "fa3_quant"
    qconfig:
      dtype: "mxfp8"
      scope: "per_block"
      symmetric: True
      method: "minmax"
    include:
      - "*self_attn"
    exclude:
      - "*indexer*"
      - "model.layers.0.*"
      - "model.layers.1.*"
      - "model.layers.2.*"
      - "model.layers.74.*"
      - "model.layers.75.*"
      - "model.layers.76.*"
      - "model.layers.77.*"
      - "model.layers.78.*"

  - type: linear_quant
    qconfig: *default_w8a8_mxfp_dynamic
    include:
    - '*self_attn*'
    exclude:
    - '*kv_b_proj'
    - '*wk'
    - '*weights_proj'

  - type: linear_quant
    qconfig: *default_w8a8_mxfp_dynamic
    include:
    - '*mlp*'
    exclude:
    - '*gate'
    - '*mlp.experts.*'

  - type: linear_quant
    qconfig: *default_w4a4_mxfp_dynamic
    include:
    - '*mlp.experts.*'

  dataset: qwen3_cot_w4a4.json
  save:
  - type: ascendv1_saver
    part_file_size: 4
