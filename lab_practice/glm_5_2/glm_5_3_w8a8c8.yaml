apiversion: modelslim_v1
metadata:
  config_id: glm_5_3_w8a8c8
  score: 90
  verified_tags:
    GLM-5.3:
      - - vLLM_Ascend
        - Atlas_A2_Inference
      - - vLLM_Ascend
        - Atlas_A3_Inference
  label:
    w_bit: 8
    a_bit: 8
    is_sparse: False
    kv_cache: True

default_w8a8_dynamic: &default_w8a8_dynamic
  act:
    scope: "per_token"
    dtype: "int8"
    symmetric: True
    method: "minmax"
  weight:
    scope: "per_channel"
    dtype: "int8"
    symmetric: True
    method: "minmax"

spec:
  process:
    - type: "quarot"
      export_extra_info: True

    - type: "flex_smooth_quant"
      enable_subgraph_type:
        - 'norm-linear'
        - 'ov'
      include:
        - "*"

    - type: "fa3_quant"
      qconfig:
        dtype: "int8"
        scope: "per_token"
        symmetric: True
        method: "minmax"
      include:
        - "*indexer*"
      exclude:
        - "model.layers.0.*"
        - "model.layers.1.*"
        - "model.layers.2.*"
        - "model.layers.70.*"
        - "model.layers.74.*"
        - "model.layers.78.*"

    - type: "fa3_quant"
      qconfig:
        dtype: "int8"
        scope: "per_token"
        symmetric: True
        method: "minmax"
      include:
        - "*self_attn"
      exclude:
        - "*indexer*"
        - "model.layers.0.*"
        - "model.layers.1.*"
        - "model.layers.2.*"
        - "model.layers.74.*"
        - "model.layers.75.*"
        - "model.layers.76.*"
        - "model.layers.77.*"
        - "model.layers.78.*"

    - type: "linear_quant"
      qconfig: *default_w8a8_dynamic
      include:
        - "*self_attn*"
      exclude:
        - "*kv_b_proj"
        - "*wk"
        - "*weights_proj"

    - type: "linear_quant"
      qconfig: *default_w8a8_dynamic
      include:
        - "*mlp*"
      exclude:
        - "*gate"

  dataset: mix_calib.jsonl
  save:
    - type: "ascendv1_saver"
      part_file_size: 4
