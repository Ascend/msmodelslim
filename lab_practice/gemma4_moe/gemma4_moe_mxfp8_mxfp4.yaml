apiversion: multimodal_vlm_modelslim_v1
metadata:
  config_id: gemma4_moe_mxfp8_mxfp4
  score: 90
  verified_tags:
    gemma-4-26B-A4B-it:
      - - vLLM_Ascend
        - Ascend_950
  label:
    w_bit: 4
    a_bit: 4
    is_sparse: False
    kv_cache: False

default_w8a8_mxfp8: &default_w8a8_mxfp8
  act:
    scope: per_block
    dtype: mxfp8
    symmetric: true
    method: minmax
  weight:
    scope: per_block
    dtype: mxfp8
    symmetric: true
    method: minmax

default_w4a4_mxfp4: &default_w4a4_mxfp4
  act:
    dtype: mxfp4
    scope: per_block
    symmetric: true
    method: minmax
    ext:
      axes: -1
  weight:
    dtype: mxfp4
    scope: per_block
    symmetric: true
    method: ceil_x
    ext:
      axes: -1
      ceil_x_value: 7.25
      enable_search: true
      search_min: 6.0
      search_max: 12.0
      search_step: 0.25

spec:
  process:
  - type: group
    configs:
    - type: linear_quant
      qconfig: *default_w8a8_mxfp8
      include:
      - '*self_attn*'
      - '*mlp*'
      exclude:
      - '*vision_tower*'
      - '*embed_vision*'
    - type: linear_quant
      qconfig: *default_w8a8_mxfp8
      include:
      - '*vision_tower*'
      exclude:
      - '*embed_vision*'
    - type: linear_quant
      qconfig: *default_w4a4_mxfp4
      include:
      - '*experts*'
      exclude:
      - '*vision_tower*'
      - '*embed_vision*'
      - '*router*'
  save:
  - type: ascendv1_saver
    part_file_size: 4
  dataset: calibImages
  default_text: Describe this image in detail.
