apiversion: modelslim_v1
metadata:
  config_id: deepseek_v4_flash_w4a4c8
  score: 90
  verified_model_types:
    - DeepSeek-V4-Flash-0731
  verified_tags:
    DeepSeek-V4-Flash-0731:
      - - vLLM_Ascend
        - Ascend_950
      - - vLLM_Ascend
        - Atlas_350
  label:
    w_bit: 4
    a_bit: 4
    is_sparse: False
    kv_cache: True

default_w4a4_mxfp: &default_w4a4_mxfp
  act:
    scope: "per_block"
    dtype: "mxfp4"
    symmetric: True
    method: "minmax"
    ext:
      axes: -1
  weight:
    scope: "per_block"
    dtype: "mxfp4"
    symmetric: True
    method: "minmax"

default_w8a8_mxfp: &default_w8a8_mxfp
  act:
    scope: "per_block"
    dtype: "mxfp8"
    symmetric: True
    method: "minmax"
    ext:
      axes: -1
  weight:
    scope: "per_block"
    dtype: "mxfp8"
    symmetric: True
    method: "minmax"

spec:
  process:
    - type: "linear_quant"
      qconfig: *default_w8a8_mxfp
      include:
        - "*attn*"
      exclude:
        - "*wo_a"
        - "*wo_b"
        - "*compressor.wgate"
        - "*compressor.wkv"
        - "*indexer.weights_proj"
        - "*indexer.compressor.wgate"
        - "*indexer.compressor.wkv"
        - "*mtp*"
    - type: "linear_quant"
      qconfig: *default_w4a4_mxfp
      include:
        - "*ffn*"
      exclude:
        - "*gate"
        - "*shared_experts*"
        - "*mtp*"
    - type: "linear_quant"
      qconfig: *default_w8a8_mxfp
      include:
        - "*ffn.shared_experts*"
      exclude:
        - "*mtp*"
  dataset: mix_calib.jsonl
  save:
    - type: "ascendv1_saver"
      part_file_size: 4
